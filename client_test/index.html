<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#141414" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Groovy</title>

    <!-- Google Fonts: Fraunces, Inter (non-render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap"
      onload="
        this.onload = null
        this.rel = 'stylesheet'
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!-- Early Theme Detection Script (Prevents FOUC) -->
    <script>
      ;(function () {
        try {
          const saved = localStorage.getItem('groovy_theme')
          const isDark =
            saved === 'dark' ||
            (!saved &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (isDark) {
            document.documentElement.classList.add('dark')
          } else {
            document.documentElement.classList.remove('dark')
          }
        } catch (_) {}
      })()
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0f0f10;
      }
      :root:not(.dark) html,
      :root:not(.dark) body {
        background: #fafafa;
      }
      .app-preloader {
        min-height: 100dvh;
        width: 100%;
        margin: 0;
        padding: 0;
        border: none;
        outline: none;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0f0f10;
        color: #f4f4f5;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
      }
      :root:not(.dark) .app-preloader {
        background: #fafafa;
        color: #18181b;
      }

      .preloader-bar-wrap {
        width: 120px;
        height: 2px;
        background: rgba(125, 125, 135, 0.2);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .preloader-bar-line {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 40%;
        background: currentColor;
        opacity: 0.7;
        border-radius: 9999px;
        animation: preloader-shift 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes preloader-shift {
        0% {
          left: -40%;
          width: 40%;
        }
        50% {
          width: 60%;
        }
        100% {
          left: 100%;
          width: 40%;
        }
      }
    </style>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root" class="main">
      <div class="app-preloader">
        <div class="preloader-bar-wrap">
          <div class="preloader-bar-line"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
